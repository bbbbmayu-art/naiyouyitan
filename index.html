<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙中心 - 生产力与灵感系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        macaron: {
                            pink: '#FFF0F7',
                            yellow: '#FEF9E7',
                            peach: '#FFE5D9',
                            mint: '#E8F5E9',
                            lavender: '#F3E5F5',
                            accent: '#FF8FAB',
                            dark: '#4A4E69'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js for reactive UI state -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FFFDF9; color: #4A4E69; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FFD1DC; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF8FAB; }
    </style>
</head>
<body class="h-screen flex overflow-hidden select-none" x-data="universeApp()" x-init="initApp()">

    <!-- 移动端半透明遮罩背景 -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" 
         x-transition:enter="transition-opacity ease-linear duration-300"
         x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-300"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 bg-black/30 z-40 md:hidden backdrop-blur-sm"></div>

    <!-- 侧边栏 Sidebar (平板滚动优化) -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" 
           class="fixed md:static inset-y-0 left-0 z-50 w-72 bg-[#FFF0F7] border-r border-pink-100 flex flex-col transition-transform duration-300 ease-in-out md:translate-x-0 shadow-lg md:shadow-none h-screen overflow-hidden">
        
        <!-- 个人卡片 -->
        <div class="p-4 border-b border-pink-200/60 flex items-center justify-between bg-white/40 flex-shrink-0">
            <div class="flex items-center space-x-3 cursor-pointer group" @click="openProfileModal = true">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-300 to-yellow-200 flex items-center justify-center text-2xl shadow-inner group-hover:scale-105 transition-transform" x-text="profile.avatar || '🌸'"></div>
                <div class="overflow-hidden">
                    <h2 class="font-bold text-gray-800 text-sm truncate" x-text="profile.name || '宇宙探索者'"></h2>
                    <p class="text-xs text-gray-500 truncate" x-text="profile.bio || '保持热爱，奔赴山海'"></p>
                </div>
            </div>
            <button @click="openProfileModal = true" class="text-gray-400 hover:text-pink-500 p-1 rounded-lg hover:bg-white/60 transition-colors">✏️</button>
        </div>

        <!-- 导航与列表容器 (确保平板纵向滚动流畅) -->
        <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
            <div class="space-y-1">
                <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">主导航</p>
                <template x-for="view in [
                    { id: 'daily', name: '☀️ 每日待办', count: getDailyCount() },
                    { id: 'calendar', name: '📅 滴答日历', count: 0 },
                    { id: 'habits', name: '⚡ 习惯打卡', count: habits.length },
                    { id: 'review', name: '📊 四维复盘', count: 0 },
                    { id: 'trash', name: '🗑️ 统一回收站', count: trashBin.length }
                ]">
                    <button @click="currentView = view.id; sidebarOpen = false"
                            :class="currentView === view.id ? 'bg-white text-pink-600 shadow-sm font-semibold' : 'text-gray-600 hover:bg-white/50'"
                            class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm transition-all">
                        <span x-text="view.name"></span>
                        <span x-show="view.count > 0" 
                              :class="view.id === 'trash' ? 'bg-red-100 text-red-600' : 'bg-pink-100 text-pink-600'" 
                              class="text-xs px-2 py-0.5 rounded-full font-medium" x-text="view.count"></span>
                    </button>
                </template>
            </div>

            <!-- 清单与文件夹管理模块 (文件夹标题字号变大并加粗) -->
            <div class="space-y-2">
                <div class="flex items-center justify-between px-3">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">清单与文件夹</p>
                    <div class="flex items-center space-x-1">
                        <button @click="openCreateModal('folder')" class="text-xs bg-white/80 hover:bg-white text-gray-600 px-2 py-1 rounded-lg shadow-sm border border-pink-150">+ 文件夹</button>
                        <button @click="openCreateModal('list')" class="text-xs bg-pink-500 hover:bg-pink-600 text-white px-2 py-1 rounded-lg shadow-sm">+ 清单</button>
                    </div>
                </div>

                <!-- 根目录清单 -->
                <div class="space-y-1 mt-1">
                    <template x-for="list in lists.filter(l => !l.folderId)" :key="list.id">
                        <div class="group flex items-center justify-between px-3 py-2 rounded-xl text-sm hover:bg-white/60 transition-colors"
                             :class="currentView === 'list_' + list.id ? 'bg-white text-pink-600 font-semibold shadow-sm' : 'text-gray-600'">
                            <div @click="currentView = 'list_' + list.id; sidebarOpen = false" class="flex items-center space-x-2.5 flex-1 cursor-pointer truncate">
                                <span class="w-3 h-3 rounded-full flex-shrink-0" :style="'background-color: ' + (list.color || '#FF8FAB')"></span>
                                <span class="truncate" x-text="list.name"></span>
                            </div>
                            <div class="hidden group-hover:flex items-center space-x-1 text-xs text-gray-400">
                                <button @click.stop="editListOrFolder(list)" class="hover:text-pink-600">✏️</button>
                                <button @click.stop="moveToTrash('list', list)" class="hover:text-red-500 ml-0.5" title="删除清单">×</button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 文件夹嵌套 (标题设为 text-base font-extrabold) -->
                <template x-for="(folder, fIndex) in folders" :key="folder.id">
                    <div class="mt-3 space-y-1">
                        <div class="group flex items-center justify-between px-3 py-2 text-base font-extrabold text-gray-800 bg-pink-100/60 rounded-xl shadow-2xs">
                            <div class="flex items-center space-x-2 truncate">
                                <span class="w-3 h-3 rounded-full" :style="'background-color: ' + (folder.color || '#FFD1DC')"></span>
                                <span class="truncate" x-text="folder.name"></span>
                            </div>
                            <div class="hidden group-hover:flex items-center space-x-1 text-gray-400 text-xs font-normal">
                                <button @click="editListOrFolder(folder)" class="hover:text-pink-600">✏️</button>
                                <button @click="moveToTrash('folder', folder)" class="hover:text-red-500 ml-0.5" title="删除文件夹">×</button>
                            </div>
                        </div>
                        <div class="pl-4 space-y-1">
                            <template x-for="list in lists.filter(l => l.folderId === folder.id)" :key="list.id">
                                <div class="group flex items-center justify-between px-3 py-1.5 rounded-xl text-sm hover:bg-white/60 transition-colors"
                                     :class="currentView === 'list_' + list.id ? 'bg-white text-pink-600 font-semibold shadow-sm' : 'text-gray-600'">
                                    <div @click="currentView = 'list_' + list.id; sidebarOpen = false" class="flex items-center space-x-2.5 flex-1 cursor-pointer truncate">
                                        <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" :style="'background-color: ' + (list.color || '#FF8FAB')"></span>
                                        <span class="truncate" x-text="list.name"></span>
                                    </div>
                                    <div class="hidden group-hover:flex items-center space-x-1 text-xs text-gray-400">
                                        <button @click.stop="editListOrFolder(list)" class="hover:text-pink-600">✏️</button>
                                        <button @click.stop="moveToTrash('list', list)" class="hover:text-red-500 ml-0.5" title="删除清单">×</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- 标签管理 -->
            <div class="space-y-2 pt-2 border-t border-pink-200/40">
                <div class="flex items-center justify-between px-3">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">标签管理</p>
                    <button @click="openTagManager()" class="text-xs text-pink-500 hover:text-pink-600 font-medium">管理</button>
                </div>
                <div class="flex flex-wrap gap-1.5 px-3">
                    <template x-for="tag in allTags" :key="tag">
                        <div class="group/tag inline-flex items-center text-xs px-2.5 py-1 rounded-lg bg-white/70 hover:bg-white text-gray-600 shadow-sm border border-pink-100 transition-colors">
                            <span @click="currentView = 'tag_' + tag; sidebarOpen = false" class="cursor-pointer" x-text="'#' + tag"></span>
                            <button @click.stop="moveToTrash('tag', tag)" class="ml-1.5 text-gray-400 hover:text-red-500 font-bold px-0.5" title="将标签移入回收站">×</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- 底部数据备份 -->
        <div class="p-4 border-t border-pink-200/60 bg-white/40 flex items-center justify-between text-xs text-gray-500 flex-shrink-0">
            <button @click="exportData()" class="hover:text-pink-600 font-medium">📥 备份数据</button>
            <label class="hover:text-pink-600 font-medium cursor-pointer">
                <span>📤 恢复数据</span>
                <input type="file" @change="importData($event)" accept=".json" class="hidden">
            </label>
        </div>
    </aside>

    <!-- 主内容区 Main Content Area (平板滚动优化) -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-white">
        <header class="h-16 border-b border-gray-100 flex items-center justify-between px-4 md:px-8 bg-white/80 backdrop-blur-md z-30 flex-shrink-0">
            <div class="flex items-center space-x-3">
                <button @click="sidebarOpen = !sidebarOpen" class="md:hidden p-2 rounded-xl bg-pink-50 text-pink-600">☰</button>
                <h1 class="text-lg md:text-xl font-bold text-gray-800" x-text="getViewTitle()"></h1>
            </div>
            <div class="flex items-center space-x-3">
                <template x-if="currentView === 'daily'">
                    <button @click="openWidgetConfig = true" class="text-xs bg-pink-50 hover:bg-pink-100 text-pink-600 px-3 py-1.5 rounded-xl font-medium">⚙️ 每日小部件</button>
                </template>
                <template x-if="currentView !== 'trash'">
                    <button @click="openTaskModalForCreate()" class="bg-gradient-to-r from-pink-400 to-pink-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-pink-200">+ 新建任务</button>
                </template>
            </div>
        </header>

        <!-- 内容视口：支持平板和手机完美滚动 -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- ☀️ 每日待办 -->
            <div x-show="currentView === 'daily'" class="max-w-4xl mx-auto space-y-6 pb-12">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div x-show="widgets.habit" class="bg-gradient-to-br from-pink-50 to-yellow-50 p-5 rounded-2xl border border-pink-100 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-gray-800 text-sm">⚡ 今日习惯速打卡</h3>
                            <span class="text-xs text-gray-400" x-text="getHabitProgressText()"></span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            <template x-for="habit in habits" :key="habit.id">
                                <button @click="toggleHabitToday(habit.id)"
                                        :class="isHabitDoneToday(habit.id) ? 'bg-pink-500 text-white shadow-sm border-transparent' : 'bg-white/80 text-gray-700 hover:bg-white border-pink-100'"
                                        class="p-2.5 rounded-xl border text-xs flex items-center space-x-2 transition-all">
                                    <span class="text-base" x-text="habit.emoji"></span>
                                    <span class="truncate font-medium" x-text="habit.name"></span>
                                </button>
                            </template>
                        </div>
                    </div>
                    <div x-show="widgets.calendar" class="bg-gradient-to-br from-yellow-50 to-pink-50 p-5 rounded-2xl border border-yellow-100 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold text-gray-800 text-sm">📅 今日日程概览</h3>
                                <span class="text-xs text-gray-500" x-text="getTodayDateStr()"></span>
                            </div>
                            <p class="text-xs text-gray-600 mb-3" x-text="getTodayTasksSummary()"></p>
                        </div>
                        <button @click="currentView = 'calendar'" class="self-start text-xs bg-white hover:bg-yellow-100 text-yellow-700 px-3 py-1.5 rounded-xl font-medium border border-yellow-200">进入完整日历 ➔</button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <div class="flex items-center space-x-3">
                            <h3 class="font-bold text-gray-800">☀️ 每日待办清单</h3>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-pink-100 text-pink-600 font-semibold" x-text="getFilteredTasks().length"></span>
                        </div>
                        <div class="flex items-center space-x-2 text-xs">
                            <label class="flex items-center space-x-1 cursor-pointer select-none text-gray-600 bg-gray-50 px-2.5 py-1.5 rounded-xl border border-gray-200">
                                <input type="checkbox" x-model="filterHideCompleted" class="rounded text-pink-500">
                                <span>隐藏已完成</span>
                            </label>
                            <select x-model="filterDateType" class="bg-gray-50 border border-gray-200 rounded-xl px-2.5 py-1.5 text-gray-600">
                                <option value="all">全部时间</option>
                                <option value="today">今日到期</option>
                                <option value="undated">无日期</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <template x-for="task in getFilteredTasks()" :key="task.id">
                            <div class="group flex items-center justify-between p-3.5 rounded-2xl border border-gray-100 hover:border-pink-200 hover:bg-pink-50/20 transition-all shadow-sm">
                                <div class="flex items-center space-x-3 flex-1 min-w-0">
                                    <input type="checkbox" :checked="task.completed" @change="toggleTaskComplete(task.id)" class="w-5 h-5 rounded-lg text-pink-500 cursor-pointer">
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium truncate" :class="task.completed ? 'line-through text-gray-400' : 'text-gray-800'" x-text="task.title"></p>
                                        <div class="flex flex-wrap items-center gap-1.5 mt-1">
                                            <span class="text-xs px-2 py-0.5 rounded-md font-medium text-white" :style="'background-color: ' + getListColor(task.listId)" x-text="getListName(task.listId)"></span>
                                            <span x-show="task.dueDate" class="text-xs px-2 py-0.5 rounded-md bg-gray-100 text-gray-600" x-text="task.dueDate"></span>
                                            <span x-show="!task.dueDate" class="text-xs px-2 py-0.5 rounded-md bg-amber-50 text-amber-600 border border-amber-100">无日期</span>
                                            <template x-for="tag in (task.tags || [])" :key="tag">
                                                <span class="text-xs px-2 py-0.5 rounded-md bg-pink-100 text-pink-600 font-medium" x-text="'#' + tag"></span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button @click="openTaskModalForEdit(task)" class="p-1.5 text-gray-400 hover:text-pink-600 rounded-lg">✏️</button>
                                    <button @click="moveToTrash('task', task)" class="p-1.5 text-gray-400 hover:text-red-500 rounded-lg" title="移入回收站">🗑️</button>
                                </div>
                            </div>
                        </template>
                        <div x-show="getFilteredTasks().length === 0" class="text-center py-12 text-gray-400 text-sm">暂无符合条件的待办任务 ✨</div>
                    </div>
                </div>
            </div>

            <!-- 📅 日历视图 -->
            <div x-show="currentView === 'calendar'" class="max-w-5xl mx-auto space-y-6 pb-12">
                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-bold text-gray-800" x-text="calendarYearMonthStr()"></h2>
                        <div class="flex items-center space-x-2">
                            <button @click="changeCalendarMonth(-1)" class="px-3 py-1.5 rounded-xl border border-gray-200 text-sm font-medium hover:bg-gray-50">◀ 上月</button>
                            <button @click="goToCurrentMonth()" class="px-3 py-1.5 rounded-xl border border-pink-200 bg-pink-50 text-pink-600 text-sm font-medium">今天</button>
                            <button @click="changeCalendarMonth(1)" class="px-3 py-1.5 rounded-xl border border-gray-200 text-sm font-medium hover:bg-gray-50">下月 ▶</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-7 gap-2 text-center font-semibold text-xs text-gray-400 uppercase">
                        <div>周日</div><div>周一</div><div>周二</div><div>周三</div><div>周四</div><div>周五</div><div>周六</div>
                    </div>
                    <div class="grid grid-cols-7 gap-2">
                        <template x-for="day in calendarDays" :key="day.dateStr">
                            <div @click="selectCalendarDate(day.dateStr)"
                                 class="min-h-[100px] p-2 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between"
                                 :class="{
                                     'bg-pink-50/50 border-pink-300 font-bold ring-1 ring-pink-300': day.isToday,
                                     'bg-gray-50/40 border-gray-100 text-gray-400': !day.isCurrentMonth,
                                     'bg-white border-gray-100 hover:border-pink-300 shadow-2xs': day.isCurrentMonth && !day.isToday,
                                     'ring-2 ring-pink-400': selectedCalendarDate === day.dateStr
                                 }">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-semibold" :class="day.isToday ? 'text-pink-600 bg-pink-100 px-2 py-0.5 rounded-full' : 'text-gray-700'" x-text="day.dayNum"></span>
                                </div>
                                <div class="space-y-1 mt-1 overflow-hidden">
                                    <template x-for="task in getTasksForDate(day.dateStr).slice(0, 3)" :key="task.id">
                                        <div class="text-[10px] px-1.5 py-0.5 rounded text-white truncate shadow-2xs"
                                             :class="task.completed ? 'opacity-50 line-through' : ''"
                                             :style="'background-color: ' + getListColor(task.listId)" x-text="task.title"></div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="selectedCalendarDate" class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 space-y-4">
                    <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                        <h3 class="font-bold text-gray-800" x-text="selectedCalendarDate + ' 的日程安排'"></h3>
                        <button @click="openTaskModalForCreateWithDate(selectedCalendarDate)" class="text-xs bg-pink-500 text-white px-3 py-1.5 rounded-xl font-semibold">+ 添加当日日程</button>
                    </div>
                    <div class="space-y-2">
                        <template x-for="task in getTasksForDate(selectedCalendarDate)" :key="task.id">
                            <div class="group flex items-center justify-between p-3 rounded-xl border border-gray-100 bg-white">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" :checked="task.completed" @change="toggleTaskComplete(task.id)" class="w-4 h-4 rounded text-pink-500">
                                    <span class="text-sm font-medium" :class="task.completed ? 'line-through text-gray-400' : 'text-gray-800'" x-text="task.title"></span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs px-2 py-0.5 rounded font-medium text-white" :style="'background-color: ' + getListColor(task.listId)" x-text="getListName(task.listId)"></span>
                                    <button @click="openTaskModalForEdit(task)" class="text-gray-400 hover:text-pink-600 p-1">✏️</button>
                                    <button @click="moveToTrash('task', task)" class="text-gray-400 hover:text-red-500 p-1">🗑️</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- ⚡ 习惯打卡 (现支持完整编辑) -->
            <div x-show="currentView === 'habits'" class="max-w-4xl mx-auto space-y-6 pb-12">
                <div class="flex items-center justify-between bg-white p-5 rounded-3xl border border-gray-100 shadow-sm">
                    <div>
                        <h2 class="font-bold text-gray-800 text-lg">⚡ 习惯每日打卡</h2>
                        <p class="text-xs text-gray-400">培养良好习惯，见证微小而坚定的进步</p>
                    </div>
                    <button @click="openHabitModalForCreate()" class="bg-pink-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-pink-250">+ 新建习惯</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="habit in habits" :key="habit.id">
                        <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-5 flex flex-col justify-between space-y-4">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 rounded-2xl bg-pink-50 flex items-center justify-center text-2xl shadow-inner" x-text="habit.emoji"></div>
                                    <div>
                                        <h3 class="font-bold text-gray-800 text-base" x-text="habit.name"></h3>
                                        <p class="text-xs text-gray-400" x-text="'目标: ' + habit.target + ' 次/天'"></p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button @click="openHabitModalForEdit(habit)" class="p-1.5 text-gray-400 hover:text-pink-600 rounded-lg">✏️</button>

                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 flex items-center justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">🗑️ 统一回收站</h2>
                        <p class="text-xs text-gray-400 mt-1">被删除的待办、习惯、文件夹、清单和标签统一暂存于此，超30天后自动清空。</p>
                    </div>
                    <button x-show="trashBin.length > 0" @click="clearAllTrash()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2 rounded-xl text-xs font-semibold">清空回收站</button>

                <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 space-y-3">
                    <template x-for="item in trashBin" :key="item.id">

    <!-- 弹窗 1：新建/编辑待办任务 (含 Emoji 快捷标签可选面板) -->

        <div @click.away="openProfileModal = false" class="bg-white rounded-3xl p-6 w-full max-w-md space-y-4">
            <h3 class="font-bold text-gray-800 text-lg">编辑个人名片</h3>

            </div>
        </div>

    <script>
        function universeApp() {
            return {
                sidebarOpen: false,
                currentView: 'daily',
                profile: { name: '宇宙探索者', bio: '保持热爱，奔赴山海', avatar: '🌸' },
                openProfileModal: false,
                widgets: { habit: true, calendar: true },
                openWidgetConfig: false,

                folders: [
                    { id: 'f1', name: '工作与学习', color: '#FF8FAB' },
                    { id: 'f2', name: '生活与日常', color: '#FFD1DC' }
                ],
                lists: [
                    { id: 'l1', folderId: 'f1', name: '核心项目', color: '#FF8FAB' },
                    { id: 'l2', folderId: 'f2', name: '灵感杂货铺', color: '#FFD1DC' }
                ],
                openFolderListModal: false,
                folderListModalTitle: '',
                folderListModalType: '',
                editingFolderList: { id: '', name: '', color: '#FF8FAB' },

                tasks: [
                    { id: 't1', title: '完成宇宙中心原型架构', listId: 'l1', dueDate: new Date().toISOString().split('T')[0], tags: ['💡 灵感', '工作'], completed: false }
                ],
                trashBin: [], // 统一回收站（存放待办、习惯、文件夹、清单、标签）
                openTaskModal: false,
                editingTask: { id: '', title: '', listId: '', dueDate: '', tagsInput: '' },
                filterHideCompleted: false,
                filterDateType: 'all',

                habits: [
                    { id: 'h1', name: '早起喝温水', emoji: '🥤', target: 1 },
                    { id: 'h2', name: '阅读30分钟', emoji: '📖', target: 1 }
                ],
                habitLogs: {},
                openHabitModal: false,
                editingHabit: { id: '', name: '', emoji: '✨', target: 1 },

                calendarYear: new Date().getFullYear(),
                calendarMonth: new Date().getMonth(),
                calendarDays: [],
                selectedCalendarDate: '',

                initApp() {
                    this.loadFromLocalStorage();
                    this.generateCalendarDays();
                    if (!this.editingTask.listId && this.lists.length > 0) {
                        this.editingTask.listId = this.lists[0].id;
                    }
                },

                get allTags() {
                    let set = new Set(['💡 灵感', '🔥 重要', '🏠 生活', '💻 工作', '📚 学习']);
                    this.tasks.forEach(t => {
                        if (t.tags && Array.isArray(t.tags)) {
                            t.tags.forEach(tag => set.add(tag));
                        }
                    });
                    return Array.from(set);
                },

                getViewTitle() {
                    if (this.currentView === 'daily') return '☀️ 每日待办系统';
                    if (this.currentView === 'calendar') return '📅 滴答清单风格日历';
                    if (this.currentView === 'habits') return '⚡ 习惯打卡专属空间';
                    if (this.currentView === 'review') return '📊 四维生产力数据复盘';
                    if (this.currentView === 'trash') return '🗑️ 统一回收站';
                    if (this.currentView.startsWith('list_')) return this.getListName(this.currentView.replace('list_', ''));
                    if (this.currentView.startsWith('tag_')) return '#' + this.getActiveTagName();
                    return '宇宙中心';
                },

                getFilteredTasks() {
                    return this.tasks.filter(t => {
                        if (this.filterHideCompleted && t.completed) return false;
                        if (this.filterDateType === 'today' && t.dueDate !== new Date().toISOString().split('T')[0]) return false;
                        if (this.filterDateType === 'undated' && t.dueDate && t.dueDate.trim() !== '') return false;
                        return true;
                    });
                },

                getDailyCount() { return this.tasks.filter(t => !t.completed).length; },
                getListName(id) { let l = this.lists.find(x => x.id === id); return l ? l.name : '默认清单'; },
                getListColor(id) { let l = this.lists.find(x => x.id === id); return l?.color || '#FF8FAB'; },
                getActiveListId() { return this.currentView.startsWith('list_') ? this.currentView.replace('list_', '') : (this.lists[0]?.id || ''); },
                getActiveListName() { return this.getListName(this.getActiveListId()); },
                getActiveListColor() { return this.getListColor(this.getActiveListId()); },
                getActiveTagName() { return this.currentView.startsWith('tag_') ? this.currentView.replace('tag_', '') : ''; },

                // 统一移入回收站
                moveToTrash(type, item) {
                    let now = new Date();
                    let timeStr = now.toISOString().split('T')[0] + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
                    
                    this.trashBin.unshift({
                        id: 'trash_' + Date.now() + Math.random(),
                        type: type, // 'task', 'habit', 'folder', 'list', 'tag'
                        data: item,
                        deletedAt: timeStr,
                        timestamp: Date.now()
                    });

                    if (type === 'task') {
                        this.tasks = this.tasks.filter(t => t.id !== item.id);
                    } else if (type === 'habit') {
                        this.habits = this.habits.filter(h => h.id !== item.id);
                    } else if (type === 'folder') {
                        this.folders = this.folders.filter(f => f.id !== item.id);
                        this.lists = this.lists.map(l => l.folderId === item.id ? { ...l, folderId: '' } : l);
                    } else if (type === 'list') {
                        this.lists = this.lists.filter(l => l.id !== item.id);
                        this.tasks = this.tasks.filter(t => t.listId !== item.id);
                    } else if (type === 'tag') {
                        this.tasks.forEach(t => {
                            if (t.tags) t.tags = t.tags.filter(tag => tag !== item);
                        });
                    }
                    this.saveToLocalStorage();
                },

                restoreFromTrash(trashId) {
                    let item = this.trashBin.find(x => x.id === trashId);
                    if (!item) return;

                    if (item.type === 'task') this.tasks.push(item.data);
                    if (item.type === 'habit') this.habits.push(item.data);
                    if (item.type === 'folder') this.folders.push(item.data);
                    if (item.type === 'list') this.lists.push(item.data);

                    this.trashBin = this.trashBin.filter(x => x.id !== trashId);
                    this.saveToLocalStorage();
                },

                deleteTrashPermanently(trashId) {
                    this.trashBin = this.trashBin.filter(x => x.id !== trashId);
                    this.saveToLocalStorage();
                },

                clearAllTrash() {
                    if (confirm('确定清空回收站吗？')) {
                        this.trashBin = [];
                        this.saveToLocalStorage();
                    }
                },

                // 待办任务创建与编辑逻辑
                openTaskModalForCreate() {
                    this.editingTask = { id: '', title: '', listId: this.lists[0]?.id || '', dueDate: new Date().toISOString().split('T')[0], tagsInput: '' };
                    this.openTaskModal = true;
                },
                openTaskModalForCreateWithList(listId) {
                    this.editingTask = { id: '', title: '', listId: listId, dueDate: new Date().toISOString().split('T')[0], tagsInput: '' };
                    this.openTaskModal = true;
                },
                openTaskModalForCreateWithDate(dateStr) {
                    this.editingTask = { id: '', title: '', listId: this.lists[0]?.id || '', dueDate: dateStr, tagsInput: '' };
                    this.openTaskModal = true;
                },
                openTaskModalForEdit(task) {
                    this.editingTask = {
                        id: task.id,
                        title: task.title,
                        listId: task.listId,
                        dueDate: task.dueDate || '',
                        tagsInput: (task.tags || []).join(', ')
                    };
                    this.openTaskModal = true;
                },
                isTaskTagSelected(tag) {
                    let currentTags = this.editingTask.tagsInput ? this.editingTask.tagsInput.split(/[,，\s]+/).map(s => s.trim().replace(/^#/, '')).filter(Boolean) : [];
                    return currentTags.includes(tag);
                },
                toggleTaskTagSelection(tag) {
                    let currentTags = this.editingTask.tagsInput ? this.editingTask.tagsInput.split(/[,，\s]+/).map(s => s.trim().replace(/^#/, '')).filter(Boolean) : [];
                    if (currentTags.includes(tag)) {
                        currentTags = currentTags.filter(t => t !== tag);
                    } else {
                        currentTags.push(tag);
                    }
                    this.editingTask.tagsInput = currentTags.join(', ');
                },
                saveTask() {
                    if (!this.editingTask.title.trim()) return;
                    let tagsArray = this.editingTask.tagsInput
                        .split(/[,，\s]+/)
                        .map(s => s.trim().replace(/^#/, ''))
                        .filter(Boolean);

                    if (this.editingTask.id) {
                        let t = this.tasks.find(x => x.id === this.editingTask.id);
                        if (t) {
                            t.title = this.editingTask.title;
                            t.listId = this.editingTask.listId;
                            t.dueDate = this.editingTask.dueDate;
                            t.tags = tagsArray;
                        }
                    } else {
                        this.tasks.push({
                            id: 't_' + Date.now(),
                            title: this.editingTask.title,
                            listId: this.editingTask.listId,
                            dueDate: this.editingTask.dueDate,
                            tags: tagsArray,
                            completed: false
                        });
                    }
                    this.openTaskModal = false;
                    this.saveToLocalStorage();
                },
                toggleTaskComplete(id) {
                    let t = this.tasks.find(x => x.id === id);
                    if (t) { t.completed = !t.completed; this.saveToLocalStorage(); }
                },

                // 文件夹与清单
                openCreateModal(type) {
                    this.folderListModalType = type;
                    this.folderListModalTitle = type === 'folder' ? '新建文件夹' : '新建清单';
                    this.editingFolderList = { id: '', name: '', color: '#FF8FAB' };
                    this.openFolderListModal = true;
                },
                editListOrFolder(item) {
                    let isFolder = this.folders.some(f => f.id === item.id);
                    this.folderListModalType = isFolder ? 'folder' : 'list';
                    this.folderListModalTitle = isFolder ? '编辑文件夹' : '编辑清单';
                    this.editingFolderList = { ...item };
                    this.openFolderListModal = true;
                },
                saveFolderOrList() {
                    if (!this.editingFolderList.name.trim()) return;
                    if (this.editingFolderList.id) {
                        if (this.folderListModalType === 'folder') {
                            let f = this.folders.find(x => x.id === this.editingFolderList.id);
                            if (f) f.name = this.editingFolderList.name;
                        } else {
                            let l = this.lists.find(x => x.id === this.editingFolderList.id);
                            if (l) l.name = this.editingFolderList.name;
                        }
                    } else {
                        if (this.folderListModalType === 'folder') {
                            this.folders.push({ id: 'f_' + Date.now(), name: this.editingFolderList.name, color: '#FF8FAB' });
                        } else {
                            this.lists.push({ id: 'l_' + Date.now(), name: this.editingFolderList.name, color: '#FF8FAB', folderId: '' });
                        }
                    }
                    this.openFolderListModal = false;
                    this.saveToLocalStorage();
                },

                // 习惯创建与编辑逻辑
                openHabitModalForCreate() {
                    this.editingHabit = { id: '', name: '', emoji: '✨', target: 1 };
                    this.openHabitModal = true;
                },
                openHabitModalForEdit(habit) {
                    this.editingHabit = { ...habit };
                    this.openHabitModal = true;
                },
                saveHabit() {
                    if (!this.editingHabit.name.trim()) return;
                    if (this.editingHabit.id) {
                        let h = this.habits.find(x => x.id === this.editingHabit.id);
                        if (h) {
                            h.name = this.editingHabit.name;
                            h.emoji = this.editingHabit.emoji || '✨';
                            h.target = Number(this.editingHabit.target) || 1;
                        }
                    } else {
                        this.habits.push({
                            id: 'h_' + Date.now(),
                            name: this.editingHabit.name,
                            emoji: this.editingHabit.emoji || '✨',
                            target: Number(this.editingHabit.target) || 1
                        });
                    }
                    this.openHabitModal = false;
                    this.saveToLocalStorage();
                },
                getTodayDateStr() { return new Date().toISOString().split('T')[0]; },
                isHabitDoneToday(id) { let today = this.getTodayDateStr(); return this.habitLogs[today]?.[id] > 0; },
                toggleHabitToday(id) {
                    let today = this.getTodayDateStr();
                    if (!this.habitLogs[today]) this.habitLogs[today] = {};
                    this.habitLogs[today][id] = this.habitLogs[today][id] > 0 ? 0 : 1;
                    this.saveToLocalStorage();
                },
                getHabitProgressText() { return `已打卡 ${this.habits.filter(h => this.isHabitDoneToday(h.id)).length}/${this.habits.length}`; },

                // 日历
                calendarYearMonthStr() { return `${this.calendarYear}年 ${this.calendarMonth + 1}月`; },
                changeCalendarMonth(d) {
                    this.calendarMonth += d;
                    if (this.calendarMonth > 11) { this.calendarMonth = 0; this.calendarYear++; }
                    else if (this.calendarMonth < 0) { this.calendarMonth = 11; this.calendarYear--; }
                    this.generateCalendarDays();
                },
                goToCurrentMonth() { let n = new Date(); this.calendarYear = n.getFullYear(); this.calendarMonth = n.getMonth(); this.generateCalendarDays(); },
                generateCalendarDays() {
                    let y = this.calendarYear, m = this.calendarMonth;
                    let first = new Date(y, m, 1).getDay(), total = new Date(y, m + 1, 0).getDate(), prevTotal = new Date(y, m, 0).getDate();
                    let today = new Date().toISOString().split('T')[0], days = [];
                    for (let i = first - 1; i >= 0; i--) days.push({ dayNum: prevTotal - i, dateStr: `${m===0?y-1:y}-${String(m===0?12:m).padStart(2,'0')}-${String(prevTotal-i).padStart(2,'0')}`, isCurrentMonth: false, isToday: false });
                    for (let i = 1; i <= total; i++) {
                        let ds = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                        days.push({ dayNum: i, dateStr: ds, isCurrentMonth: true, isToday: ds === today });
                    }
                    this.calendarDays = days;
                    if (!this.selectedCalendarDate) this.selectedCalendarDate = today;
                },
                selectCalendarDate(ds) { this.selectedCalendarDate = ds; },
                getTasksForDate(ds) { return this.tasks.filter(t => t.dueDate === ds); },

                // 复盘统计
                getHabitMonthlyDoneDays(id) {
                    let prefix = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
                    return Object.keys(this.habitLogs).filter(d => d.startsWith(prefix) && this.habitLogs[d][id] > 0).length;
                },
                getTodayCompletionRate() {
                    let t = this.getTodayDateStr(), list = this.tasks.filter(x => x.dueDate === t);
                    return list.length === 0 ? 100 : Math.round((list.filter(x => x.completed).length / list.length) * 100);
                },

                openTagManager() { alert('您可以在侧边栏直接点击标签右侧的 × 将其移入回收站！'); },
                saveProfile() { this.openProfileModal = false; this.saveToLocalStorage(); },
                getTodayTasksSummary() { return '今日任务运转顺利 🌸'; },

                saveToLocalStorage() {
                    localStorage.setItem('universe_center_data', JSON.stringify({
                        profile: this.profile, widgets: this.widgets, folders: this.folders,
                        lists: this.lists, tasks: this.tasks, trashBin: this.trashBin,
                        habits: this.habits, habitLogs: this.habitLogs
                    }));
                },
                loadFromLocalStorage() {
                    let saved = localStorage.getItem('universe_center_data');
                    if (saved) {
                        try {
                            let d = JSON.parse(saved);
                            if (d.profile) this.profile = d.profile;
                            if (d.widgets) this.widgets = d.widgets;
                            if (d.folders) this.folders = d.folders;
                            if (d.lists) this.lists = d.lists;
                            if (d.tasks) this.tasks = d.tasks;
                            if (d.trashBin) this.trashBin = d.trashBin;
                            if (d.habits) this.habits = d.habits;
                            if (d.habitLogs) this.habitLogs = d.habitLogs;
                        } catch(e) {}
                    }
                },
                exportData() {
                    let blob = new Blob([localStorage.getItem('universe_center_data') || '{}'], { type: 'application/json' });
                    let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'universe_backup.json'; a.click();
                },
                importData(e) {
                    let f = e.target.files[0];
                    if (!f) return;
                    let r = new FileReader();
                    r.onload = (evt) => { localStorage.setItem('universe_center_data', evt.target.result); location.reload(); };
                    r.readAsText(f);
                }
            }
        }
    </script>
</body>
</html>
