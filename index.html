<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙中心 - 生产力与灵感系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.8); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} {...props}></i>;
        };

        function App() {
            const [currentView, setCurrentView] = useState('inbox');
            
            // 基础状态与本地存储
            const [todos, setTodos] = useState(() => {
                const saved = localStorage.getItem('universe_todos');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: '欢迎来到宇宙中心 🚀', completed: false, date: new Date().toISOString().split('T')[0], priority: 'high', folderId: null, tags: ['💡 灵感'] }
                ];
            });

            const [folders, setFolders] = useState(() => {
                const saved = localStorage.getItem('universe_folders');
                return saved ? JSON.parse(saved) : [
                    { id: 'f1', name: '工作项目', icon: 'briefcase' }
                ];
            });

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('universe_habits');
                return saved ? JSON.parse(saved) : [
                    { id: 'h1', name: '喝水 2L 💧', logs: {} }
                ];
            });

            const [notes, setNotes] = useState(() => {
                const saved = localStorage.getItem('universe_notes');
                return saved ? JSON.parse(saved) : [
                    { id: 'n1', title: '灵感随想', content: '这是一个测试灵感记录。', date: new Date().toISOString() }
                ];
            });

            const [trashBin, setTrashBin] = useState(() => {
                const saved = localStorage.getItem('universe_trash');
                return saved ? JSON.parse(saved) : [];
            });

            // 弹窗状态
            const [isTodoModalOpen, setIsTodoModalOpen] = useState(false);
            const [currentTodo, setCurrentTodo] = useState({ title: '', date: new Date().toISOString().split('T')[0], priority: 'medium', folderId: null, tags: [] });

            // 持久化同步
            useEffect(() => { localStorage.setItem('universe_todos', JSON.stringify(todos)); }, [todos]);
            useEffect(() => { localStorage.setItem('universe_folders', JSON.stringify(folders)); }, [folders]);
            useEffect(() => { localStorage.setItem('universe_habits', JSON.stringify(habits)); }, [habits]);
            useEffect(() => { localStorage.setItem('universe_notes', JSON.stringify(notes)); }, [notes]);
            useEffect(() => { localStorage.setItem('universe_trash', JSON.stringify(trashBin)); }, [trashBin]);

            // 习惯打卡自动日期校验
            const todayStr = new Date().toISOString().split('T')[0];
            const toggleHabitLog = (habitId) => {
                setHabits(prev => prev.map(h => {
                    if (h.id === habitId) {
                        const newLogs = { ...h.logs };
                        newLogs[todayStr] = !newLogs[todayStr];
                        return { ...h, logs: newLogs };
                    }
                    return h;
                }));
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* 侧边栏 */}
                    <aside className="w-64 bg-white border-r border-slate-200 flex flex-col justify-between">
                        <div className="p-4 overflow-y-auto">
                            <div className="flex items-center space-x-2 px-2 py-3 mb-4">
                                <span className="text-2xl">🌌</span>
                                <h1 className="font-bold text-lg text-slate-800">宇宙中心</h1>
                            </div>

                            <nav className="space-y-1">
                                <button onClick={() => setCurrentView('inbox')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'inbox' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <Icon name="inbox" />
                                    <span>收集箱</span>
                                </button>
                                <button onClick={() => setCurrentView('calendar')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'calendar' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <Icon name="calendar" />
                                    <span>日历视图</span>
                                </button>
                                <button onClick={() => setCurrentView('habits')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'habits' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <Icon name="check-circle" />
                                    <span>习惯打卡</span>
                                </button>
                                <button onClick={() => setCurrentView('notes')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'notes' ? 'bg-indigo-50 text-indigo-600' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    <Icon name="file-text" />
                                    <span>灵感笔记</span>
                                </button>
                            </nav>
                        </div>

                        <div className="p-4 border-t border-slate-200">
                            <button onClick={() => setCurrentView('trash')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-sm font-medium ${currentView === 'trash' ? 'bg-red-50 text-red-600' : 'text-slate-500 hover:bg-slate-100'}`}>
                                <Icon name="trash-2" />
                                <span>回收站 ({trashBin.length})</span>
                            </button>
                        </div>
                    </aside>

                    {/* 主内容区 */}
                    <main className="flex-1 flex flex-col h-screen overflow-y-auto bg-white p-8">
                        {currentView === 'inbox' && (
                            <div>
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold">收集箱</h2>
                                    <button onClick={() => setIsTodoModalOpen(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700 text-sm font-medium">+ 新增待办</button>
                                </div>
                                <div className="space-y-2">
                                    {todos.map(todo => (
                                        <div key={todo.id} className={`flex items-center justify-between p-3 border rounded-lg transition ${todo.completed ? 'bg-slate-50 border-slate-200' : 'bg-white border-slate-100'}`}>
                                            <div className="flex items-center space-x-3">
                                                <input type="checkbox" checked={todo.completed} onChange={() => setTodos(todos.map(t => t.id === todo.id ? {...t, completed: !t.completed} : t))} className="w-4 h-4 text-indigo-600 rounded" />
                                                <span className={`${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>{todo.title}</span>
                                            </div>
                                            <button onClick={() => {
                                                setTrashBin(prev => [{ id: Date.now(), type: 'todo', data: todo, deletedAt: new Date().toLocaleString() }, ...prev]);
                                                setTodos(prev => prev.filter(t => t.id !== todo.id));
                                            }} className="text-slate-400 hover:text-red-500">
                                                <Icon name="trash-2" className="w-4 h-4" />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentView === 'calendar' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-6">日历视图</h2>
                                <p className="text-slate-500">日历视图内容正常加载中...</p>
                            </div>
                        )}

                        {currentView === 'habits' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-6">习惯打卡</h2>
                                <div className="space-y-3">
                                    {habits.map(habit => (
                                        <div key={habit.id} className="flex items-center justify-between p-4 border rounded-lg">
                                            <span>{habit.name}</span>
                                            <button onClick={() => toggleHabitLog(habit.id)} className={`px-4 py-1.5 rounded text-sm ${habit.logs[todayStr] ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-700'}`}>
                                                {habit.logs[todayStr] ? '已完成 ✓' : '今日打卡'}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentView === 'notes' && (
                            <div>
                                <h2 className="text-2xl font-bold mb-6">灵感笔记</h2>
                                <div className="space-y-3">
                                    {notes.map(note => (
                                        <div key={note.id} className="p-4 border rounded-lg">
                                            <h3 className="font-bold text-lg mb-1">{note.title}</h3>
                                            <p className="text-slate-600 text-sm">{note.content}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {currentView === 'trash' && (
                            <div>
                                <h2 className="text-2xl font-bold text-red-600 mb-6">回收站</h2>
                                <div className="space-y-3">
                                    {trashBin.length === 0 ? (
                                        <p className="text-slate-400 text-center py-12">回收站是空的</p>
                                    ) : (
                                        trashBin.map(item => (
                                            <div key={item.id} className="flex items-center justify-between p-4 border rounded-lg bg-slate-50">
                                                <span>{item.data.title || item.data.name}</span>
                                                <button onClick={() => {
                                                    setTodos(prev => [item.data, ...prev]);
                                                    setTrashBin(prev => prev.filter(t => t.id !== item.id));
                                                }} className="px-3 py-1 bg-white border rounded text-xs">恢复</button>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 新增待办弹窗 */}
                    {isTodoModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl p-6 w-full max-w-md shadow-xl">
                                <h3 className="text-lg font-bold mb-4">创建新待办</h3>
                                <input 
                                    type="text" 
                                    placeholder="输入待办内容..." 
                                    value={currentTodo.title} 
                                    onChange={e => setCurrentTodo({...currentTodo, title: e.target.value})} 
                                    className="w-full border border-slate-200 rounded-lg p-2.5 mb-4 text-sm focus:outline-none focus:border-indigo-500" 
                                />
                                <div className="flex justify-end space-x-2">
                                    <button onClick={() => setIsTodoModalOpen(false)} className="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-100">取消</button>
                                    <button onClick={() => {
                                        if (!currentTodo.title.trim()) return;
                                        setTodos(prev => [{
                                            id: Date.now(),
                                            title: currentTodo.title,
                                            completed: false,
                                            date: new Date().toISOString().split('T')[0],
                                            tags: []
                                        }, ...prev]);
                                        setCurrentTodo({ title: '', date: new Date().toISOString().split('T')[0], priority: 'medium', folderId: null, tags: [] });
                                        setIsTodoModalOpen(false);
                                    }} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">确定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
