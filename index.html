<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宇宙中心 - 生产力与灵感系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest 动态引入或基础支持 -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E5%AE%87%E5%AE%99%E4%B8%AD%E5%BF%83%22%2C%22short_name%22%3A%22%E5%AE%87%E5%AE%99%E4%B8%AD%E5%BF%83%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%236366f1%22%2C%22icons%22%3A%5B%5D%7D">
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased h-screen overflow-hidden flex flex-col" x-data="universeApp()" x-init="init()">

    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-slate-200 h-14 px-4 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button @click="sidebarOpen = !sidebarOpen" class="md:hidden text-slate-600 hover:text-indigo-600 focus:outline-none p-1">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm shadow-indigo-200">
                    <i class="fa-solid fa-atom text-sm"></i>
                </div>
                <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">宇宙中心</h1>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <button @click="openTaskModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition shadow-sm shadow-indigo-200 flex items-center space-x-1.5">
                <i class="fa-solid fa-plus text-xs"></i>
                <span class="hidden sm:inline">新待办</span>
            </button>
            <div class="h-5 w-px bg-slate-200"></div>
            <button @click="exportData()" title="导出备份" class="text-slate-500 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-100 transition">
                <i class="fa-solid fa-cloud-arrow-down"></i>
            </button>
            <label title="导入备份" class="text-slate-500 hover:text-indigo-600 p-2 rounded-lg hover:bg-slate-100 transition cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <input type="file" @change="importData($event)" accept=".json" class="hidden">
            </label>
        </div>
    </header>

    <!-- 主体布局 -->
    <div class="flex-1 flex overflow-hidden relative">

        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-slate-900/20 z-30 md:hidden" x-cloak></div>

        <!-- 左侧边栏 -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 ease-in-out z-40 md:translate-x-0 shrink-0">
            
            <div class="p-3 space-y-1 border-b border-slate-100">
                <button @click="currentView = 'today'; sidebarOpen = false" :class="currentView === 'today' ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-sun w-5 text-center text-amber-500"></i>
                        <span>今日/收集箱</span>
                    </div>
                    <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full" x-text="todayTasksCount"></span>
                </button>
                <button @click="currentView = 'calendar'; sidebarOpen = false" :class="currentView === 'calendar' ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-calendar-days w-5 text-center text-indigo-500"></i>
                        <span>日历视图</span>
                    </div>
                </button>
                <button @click="currentView = 'review'; sidebarOpen = false" :class="currentView === 'review' ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-chart-pie w-5 text-center text-emerald-500"></i>
                        <span>四维复盘</span>
                    </div>
                </button>
                <button @click="currentView = 'trash'; sidebarOpen = false" :class="currentView === 'trash' ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-trash-can w-5 text-center text-rose-500"></i>
                        <span>废纸篓</span>
                    </div>
                    <span class="text-xs bg-rose-50 text-rose-600 px-2 py-0.5 rounded-full" x-text="trashTasks.length" x-show="trashTasks.length > 0"></span>
                </button>
            </div>

            <!-- 文件夹、清单与标签 -->
            <div class="flex-1 overflow-y-auto p-3 space-y-4">
                <div>
                    <div class="flex items-center justify-between px-3 mb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <span>清单</span>
                        <button @click="openFolderModal()" class="hover:text-indigo-600 transition" title="新建文件夹"><i class="fa-solid fa-folder-plus"></i></button>
                    </div>

                    <button @click="currentView = 'nodate'; sidebarOpen = false" :class="currentView === 'nodate' ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-sm transition">
                        <div class="flex items-center space-x-2.5">
                            <i class="fa-solid fa-inbox w-4 text-center text-slate-400"></i>
                            <span>无日期待办</span>
                        </div>
                        <span class="text-xs text-slate-400" x-text="noDateTasksCount"></span>
                    </button>

                    <template v-for="(folder, fIndex) in folders" :key="folder.id">
                        <div class="mt-2">
                            <div @click="toggleFolderExpand(folder.id)" class="flex items-center justify-between px-3 py-1 text-xs font-medium text-slate-500 group cursor-pointer hover:bg-slate-50 rounded-lg">
                                <div class="flex items-center space-x-2 truncate">
                                    <i :class="isFolderExpanded(folder.id) ? 'fa-solid fa-folder-open text-amber-400' : 'fa-solid fa-folder text-amber-400'"></i>
                                    <span class="truncate" x-text="folder.name"></span>
                                    <i :class="isFolderExpanded(folder.id) ? 'fa-solid fa-chevron-down text-[9px]' : 'fa-solid fa-chevron-right text-[9px]'" class="text-slate-400"></i>
                                </div>
                                <div class="hidden group-hover:flex items-center space-x-1">
                                    <button @click.stop="moveFolder(fIndex, -1)" class="hover:text-indigo-600 p-0.5" title="上移"><i class="fa-solid fa-arrow-up text-[10px]"></i></button>
                                    <button @click.stop="moveFolder(fIndex, 1)" class="hover:text-indigo-600 p-0.5" title="下移"><i class="fa-solid fa-arrow-down text-[10px]"></i></button>
                                    <button @click.stop="openSubListModal(folder.id)" class="hover:text-indigo-600 p-0.5" title="添加清单"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                    <button @click.stop="confirmDeleteFolder(folder.id)" class="hover:text-rose-600 p-0.5" title="删除文件夹"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                </div>
                            </div>
                            <div x-show="isFolderExpanded(folder.id)" x-transition class="pl-3 space-y-0.5 mt-0.5">
                                <template v-for="(list, lIndex) in getListsByFolder(folder.id)" :key="list.id">
                                    <div @click="currentView = 'list'; currentListId = list.id; sidebarOpen = false" 
                                         :class="(currentView === 'list' && currentListId === list.id) ? 'bg-indigo-50 text-indigo-600 font-semibold' : 'text-slate-600 hover:bg-slate-50'" 
                                         class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-sm transition cursor-pointer group/item">
                                        <div class="flex items-center space-x-2 truncate">
                                            <span class="w-2 h-2 rounded-full" :style="'background-color: ' + (list.color || '#6366f1')"></span>
                                            <span class="truncate" x-text="list.name"></span>
                                        </div>
                                        <div class="hidden group-hover/item:flex items-center space-x-1">
                                            <button @click.stop="moveList(list.id, -1)" class="hover:text-indigo-600 p-0.5" title="上移"><i class="fa-solid fa-arrow-up text-[10px]"></i></button>
                                            <button @click.stop="moveList(list.id, 1)" class="hover:text-indigo-600 p-0.5" title="下移"><i class="fa-solid fa-arrow-down text-[10px]"></i></button>
                                            <button @click.stop="confirmDeleteList(list.id)" class="hover:text-rose-600 p-0.5" title="删除清单"><i class="fa-solid fa-trash text-[10px]"></i></button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- 标签管理区 -->
                <div class="pt-2 border-t border-slate-100">
                    <div class="flex items-center justify-between px-3 mb-1 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <span>标签</span>
                        <button @click="openTagModal()" class="hover:text-indigo-600 transition" title="新建标签"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="flex flex-wrap gap-1 px-2 pt-1">
                        <template v-for="tag in tags" :key="tag.id">
                            <div @click="currentView = 'tag'; currentTagId = tag.id; sidebarOpen = false" 
                                 :class="(currentView === 'tag' && currentTagId === tag.id) ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'" 
                                 class="group/tag inline-flex items-center space-x-1 px-2 py-1 rounded-md text-xs transition cursor-pointer">
                                <span x-text="'#' + tag.name"></span>
                                <span @click.stop="openEditTagModal(tag)" class="opacity-0 group-hover/tag:opacity-100 hover:text-amber-300 ml-0.5"><i class="fa-solid fa-pen text-[9px]"></i></span>
                                <span @click.stop="confirmDeleteTag(tag.id)" class="opacity-0 group-hover/tag:opacity-100 hover:text-rose-300 ml-0.5"><i class="fa-solid fa-xmark text-[9px]"></i></span>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="flex-1 flex flex-col overflow-y-auto bg-slate-50/50 p-4 sm:p-6 lg:p-8">
            <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col">

                <!-- 视图 1：今日 / 收集箱 -->
                <template v-if="currentView === 'today'">
                    <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">今日待办</h2>
                            <p class="text-sm text-slate-500 mt-0.5" x-text="formattedTodayDate"></p>
                        </div>
                        <div class="flex items-center space-x-2 bg-white border border-slate-200 px-3 py-1.5 rounded-lg shadow-xs self-start sm:self-auto">
                            <label class="text-xs text-slate-600 cursor-pointer select-none flex items-center space-x-1.5">
                                <input type="checkbox" x-model="hideCompleted" class="rounded text-indigo-600 focus:ring-indigo-500 w-3.5 h-3.5">
                                <span>隐藏已完成</span>
                            </label>
                        </div>
                    </div>

                    <div class="space-y-2 mb-6 flex-1">
                        <template v-for="task in filteredTodayTasks" :key="task.id">
                            <div class="bg-white border border-slate-200/80 rounded-xl p-3.5 flex items-start justify-between shadow-xs hover:border-slate-300 transition group">
                                <div class="flex items-start space-x-3 flex-1 min-w-0 pr-2">
                                    <input type="checkbox" :checked="task.completed" @change="toggleTaskStatus(task.id)" class="mt-1 rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 shrink-0 cursor-pointer">
                                    <div class="flex-1 min-w-0">
                                        <p :class="task.completed ? 'line-through text-slate-400' : 'text-slate-800'" class="text-sm font-medium break-words" x-text="task.title"></p>
                                        <div class="flex flex-wrap items-center gap-2 mt-1.5">
                                            <span v-if="task.dueDate" class="text-[11px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded flex items-center space-x-1">
                                                <i class="fa-regular fa-clock text-[10px]"></i>
                                                <span x-text="task.dueDate"></span>
                                            </span>
                                            <span v-if="task.repeat && task.repeat !== 'none'" class="text-[11px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded flex items-center space-x-1">
                                                <i class="fa-solid fa-repeat text-[10px]"></i>
                                                <span x-text="getRepeatLabel(task.repeat)"></span>
                                            </span>
                                            <template v-for="tagId in task.tagIds" :key="tagId">
                                                <span class="text-[11px] text-indigo-600 bg-indigo-50/80 px-1.5 py-0.5 rounded" x-text="'#' + getTagName(tagId)"></span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition shrink-0">
                                    <button @click="openTaskModal(task)" class="text-slate-400 hover:text-indigo-600 p-1" title="编辑"><i class="fa-solid fa-pen text-xs"></i></button>
                                    <button @click="deleteTask(task.id)" class="text-slate-400 hover:text-rose-600 p-1" title="删除"><i class="fa-solid fa-trash text-xs"></i></button>
                                </div>
                            </div>
                        </template>

                        <div v-if="filteredTodayTasks.length === 0" class="text-center py-12 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl">
                            <i class="fa-solid fa-circle-check text-3xl mb-2 text-slate-300"></i>
                            <p class="text-sm">今日暂无待办，享受美好的一天吧！</p>
                        </div>
                    </div>
                </template>

                <!-- 视图 2：日历视图 -->
                <template v-if="currentView === 'calendar'">
                    <div class="mb-6 flex items-center justify-between">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">日历视图</h2>
                            <p class="text-sm text-slate-500 mt-0.5" x-text="calendarHeaderTitle"></p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button @click="changeMonth(-1)" class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-50 transition"><i class="fa-solid fa-chevron-left"></i></button>
                            <button @click="currentMonthYear = new Date()" class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-50 transition">今天</button>
                            <button @click="changeMonth(1)" class="bg-white border border-slate-200 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-50 transition"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>

                    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs">
                        <div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-semibold text-slate-400">
                            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
                        </div>
                        <div class="grid grid-cols-7 gap-2">
                            <template v-for="day in calendarDays" :key="day.dateString">
                                <div @click="openTaskModalForDate(day.dateString)" 
                                     :class="{
                                         'bg-indigo-50/50 border-indigo-200': day.isCurrentMonth,
                                         'bg-slate-50/50 text-slate-400 border-slate-100': !day.isCurrentMonth,
                                         'ring-2 ring-indigo-600': day.isToday
                                     }"
                                     class="min-h-[80px] sm:min-h-[100px] border rounded-xl p-1.5 flex flex-col justify-between hover:border-indigo-300 transition cursor-pointer">
                                    <div class="flex items-center justify-between">
                                        <span :class="day.isToday ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold' : 'text-xs font-medium text-slate-700'" x-text="day.dayNumber"></span>
                                        <span class="text-[10px] text-slate-400" x-text="day.tasks.length > 0 ? day.tasks.length + '项' : ''"></span>
                                    </div>
                                    <div class="space-y-1 overflow-y-auto max-h-[60px]">
                                        <template v-for="task in day.tasks" :key="task.id">
                                            <div @click.stop="toggleTaskStatus(task.id)" :class="task.completed ? 'bg-slate-100 text-slate-400 line-through' : 'bg-indigo-50 text-indigo-700'" class="text-[10px] px-1.5 py-0.5 rounded truncate flex items-center justify-between">
                                                <span class="truncate" x-text="task.title"></span>
                                                <i v-if="task.completed" class="fa-solid fa-check text-[8px] ml-1"></i>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 视图 3：四维复盘 -->
                <template v-if="currentView === 'review'">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-slate-900">四维深度复盘</h2>
                        <p class="text-sm text-slate-500 mt-0.5">多维度解构你的生产力与习惯资产</p>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs">
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-slate-800 flex items-center space-x-2">
                                    <i class="fa-solid fa-fire text-amber-500"></i>
                                    <span>维度一：习惯打卡</span>
                                </h3>
                                <button @click="openHabitModal()" class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-lg font-medium hover:bg-indigo-100 transition"><i class="fa-solid fa-plus mr-1"></i>新习惯</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <template v-for="habit in habits" :key="habit.id">
                                    <div class="border border-slate-100 bg-slate-50/50 rounded-xl p-3 flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <span class="text-2xl" x-text="habit.emoji || '⭐'"></span>
                                            <div>
                                                <h4 class="text-sm font-semibold text-slate-800" x-text="habit.name"></h4>
                                                <p class="text-xs text-slate-500 mt-0.5" x-text="'本月累计打卡 ' + getHabitCount(habit.id) + ' 天'"></p>
                                            </div>
                                        </div>
                                        <button @click="toggleHabitToday(habit.id)" :class="isHabitCheckedToday(habit.id) ? 'bg-emerald-500 text-white' : 'bg-white border border-slate-200 text-slate-400 hover:border-slate-300'" class="w-9 h-9 rounded-xl flex items-center justify-center transition shadow-xs">
                                            <i class="fa-solid fa-check"></i>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs">
                            <h3 class="font-bold text-slate-800 flex items-center space-x-2 mb-4">
                                <i class="fa-solid fa-chart-line text-indigo-500"></i>
                                <span>维度二：时间效率</span>
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <p class="text-xs font-medium text-slate-500">本日完成率</p>
                                    <div class="flex items-baseline justify-between mt-2">
                                        <span class="text-2xl font-bold text-slate-800" x-text="todayCompletionRate + '%'"></span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" :style="'width: ' + todayCompletionRate + '%'"></div>
                                    </div>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <p class="text-xs font-medium text-slate-500">本周完成率</p>
                                    <div class="flex items-baseline justify-between mt-2">
                                        <span class="text-2xl font-bold text-slate-800" x-text="weekCompletionRate + '%'"></span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" :style="'width: ' + weekCompletionRate + '%'"></div>
                                    </div>
                                </div>
                                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                    <p class="text-xs font-medium text-slate-500">本月完成率</p>
                                    <div class="flex items-baseline justify-between mt-2">
                                        <span class="text-2xl font-bold text-slate-800" x-text="monthCompletionRate + '%'"></span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-1.5 rounded-full mt-2 overflow-hidden">
                                        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" :style="'width: ' + monthCompletionRate + '%'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

    <!-- Alpine.js 核心逻辑 -->
    <script>
        function universeApp() {
            return {
                sidebarOpen: false,
                currentView: 'today',
                currentListId: null,
                currentTagId: null,
                currentMonthYear: new Date(),
                hideCompleted: false,

                tasks: [],
                trashTasks: [],
                folders: [],
                lists: [],
                tags: [],
                habits: [],
                habitLogs: {},
                expandedFolders: {},

                taskModalOpen: false,
                editingTask: { id: null, title: '', dueDate: '', listId: '', repeat: 'none', tagIds: [] },
                
                folderModalOpen: false,
                newFolderName: '',

                listModalOpen: false,
                targetFolderIdForSub: null,
                newList: { name: '', color: '#6366f1' },

                tagModalOpen: false,
                editingTag: { id: null, name: '' },

                habitModalOpen: false,
                newHabit: { emoji: '', name: '' },

                confirmModalOpen: false,
                confirmMessage: '',
                confirmCallback: null,

                init() {
                    const saved = localStorage.getItem('universe_center_data');
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.tasks = data.tasks || [];
                            this.trashTasks = data.trashTasks || [];
                            this.folders = data.folders || [];
                            this.lists = data.lists || [];
                            this.tags = data.tags || [];
                            this.habits = data.habits || [];
                            this.habitLogs = data.habitLogs || {};
                            this.expandedFolders = data.expandedFolders || {};
                        } catch(e) { console.error('数据加载失败', e); }
                    } else {
                        this.tags = [
                            { id: 't1', name: '工作' },
                            { id: 't2', name: '灵感' },
                            { id: 't3', name: '生活' }
                        ];
                        this.folders = [
                            { id: 'f1', name: '个人成长' }
                        ];
                        this.lists = [
                            { id: 'l1', folderId: 'f1', name: '日常习惯', color: '#6366f1' }
                        ];
                        this.habits = [
                            { id: 'h1', emoji: '💧', name: '喝水 2000ml' },
                            { id: 'h2', emoji: '📚', name: '阅读 30 分钟' }
                        ];
                        this.expandedFolders = { 'f1': true };
                    }
                    this.cleanOldTrash();
                    this.saveData();
                },

                saveData() {
                    const data = {
                        tasks: this.tasks,
                        trashTasks: this.trashTasks,
                        folders: this.folders,
                        lists: this.lists,
                        tags: this.tags,
                        habits: this.habits,
                        habitLogs: this.habitLogs,
                        expandedFolders: this.expandedFolders
                    };
                    localStorage.setItem('universe_center_data', JSON.stringify(data));
                },

                toggleFolderExpand(folderId) {
                    this.expandedFolders[folderId] = !this.isFolderExpanded(folderId);
                    this.saveData();
                },

                isFolderExpanded(folderId) {
                    if (this.expandedFolders[folderId] === undefined) {
                        return true;
                    }
                    return !!this.expandedFolders[folderId];
                },

                cleanOldTrash() {
                    const now = new Date().getTime();
                    this.trashTasks = this.trashTasks.filter(t => {
                        const deletedTime = new Date(t.deletedTimestamp || now).getTime();
                        return (now - deletedTime) < 30 * 24 * 60 * 60 * 1000;
                    });
                },

                get formattedTodayDate() {
                    const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
                    return new Date().toLocaleDateString('zh-CN', options);
                },

                get todayString() {
                    const d = new Date();
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                },

                get todayTasksCount() {
                    return this.tasks.filter(t => t.dueDate === this.todayString && !t.completed).length;
                },

                get noDateTasksCount() {
                    return this.tasks.filter(t => !t.dueDate).length;
                },

                get allLists() {
                    return this.lists;
                },

                getListsByFolder(folderId) {
                    return this.lists.filter(l => l.folderId === folderId);
                },

                getTagName(tagId) {
                    const tag = this.tags.find(t => t.id === tagId);
                    return tag ? tag.name : '';
                },

                getRepeatLabel(repeat) {
                    if (repeat === 'daily') return '每天循环';
                    if (repeat === 'weekly') return '每周循环';
                    if (repeat === 'monthly') return '每月循环';
                    return '';
                },

                get filteredTodayTasks() {
                    let list = this.tasks.filter(t => t.dueDate === this.todayString);
                    if (this.hideCompleted) {
                        list = list.filter(t => !t.completed);
                    }
                    return list;
                },

                get activeListTitle() {
                    if (this.currentView === 'nodate') return '无日期待办';
                    if (this.currentView === 'list') {
                        const l = this.lists.find(item => item.id === this.currentListId);
                        return l ? l.name : '清单';
                    }
                    if (this.currentView === 'tag') {
                        const tag = this.tags.find(t => t.id === this.currentTagId);
                        return tag ? '#' + tag.name : '标签';
                    }
                    return '清单';
                },

                get activeFilteredTasks() {
                    let list = [];
                    if (this.currentView === 'nodate') {
                        list = this.tasks.filter(t => !t.dueDate);
                    } else if (this.currentView === 'list') {
                        list = this.tasks.filter(t => t.listId === this.currentListId);
                    } else if (this.currentView === 'tag') {
                        list = this.tasks.filter(t => t.tagIds && t.tagIds.includes(this.currentTagId));
                    }
                    if (this.hideCompleted) {
                        list = list.filter(t => !t.completed);
                    }
                    return list;
                },

                openTaskModal(task = null, defaultDate = '') {
                    if (task) {
                        this.editingTask = { 
                            id: task.id, 
                            title: task.title, 
                            dueDate: task.dueDate || '', 
                            listId: task.listId || '', 
                            repeat: task.repeat || 'none',
                            tagIds: [...(task.tagIds || [])] 
                        };
                    } else {
                        this.editingTask = { 
                            id: null, 
                            title: '', 
                            dueDate: defaultDate || this.todayString, 
                            listId: this.currentView === 'list' ? this.currentListId : '', 
                            repeat: 'none',
                            tagIds: [] 
                        };
                    }
                    this.taskModalOpen = true;
                },

                openTaskModalForDate(dateStr) {
                    this.openTaskModal(null, dateStr);
                },

                toggleTaskTagSelection(tagId) {
                    const idx = this.editingTask.tagIds.indexOf(tagId);
                    if (idx > -1) {
                        this.editingTask.tagIds.splice(idx, 1);
                    } else {
                        this.editingTask.tagIds.push(tagId);
                    }
                },

                saveTask() {
                    if (!this.editingTask.title.trim()) return;
                    if (this.editingTask.id) {
                        const t = this.tasks.find(item => item.id === this.editingTask.id);
                        if (t) {
                            t.title = this.editingTask.title;
                            t.dueDate = this.editingTask.dueDate;
                            t.listId = this.editingTask.listId;
                            t.repeat = this.editingTask.repeat;
                            t.tagIds = [...this.editingTask.tagIds];
                        }
                    } else {
                        const newTask = {
                            id: 't_' + Date.now(),
                            title: this.editingTask.title,
                            dueDate: this.editingTask.dueDate,
                            listId: this.editingTask.listId,
                            repeat: this.editingTask.repeat,
                            tagIds: [...this.editingTask.tagIds],
                            completed: false
                        };
                        this.tasks.push(newTask);
                    }
                    this.taskModalOpen = false;
                    this.saveData();
                },

                toggleTaskStatus(taskId) {
                    const t = this.tasks.find(item => item.id === taskId);
                    if (t) {
                        t.completed = !t.completed;
                        if (t.completed && t.repeat && t.repeat !== 'none' && t.dueDate) {
                            let nextDate = new Date(t.dueDate);
                            if (t.repeat === 'daily') nextDate.setDate(nextDate.getDate() + 1);
                            else if (t.repeat === 'weekly') nextDate.setDate(nextDate.getDate() + 7);
                            else if (t.repeat === 'monthly') nextDate.setMonth(nextDate.getMonth() + 1);

                            const year = nextDate.getFullYear();
                            const month = String(nextDate.getMonth() + 1).padStart(2, '0');
                            const day = String(nextDate.getDate()).padStart(2, '0');
                            const nextDateStr = `${year}-${month}-${day}`;

                            this.tasks.push({
                                id: 't_' + Date.now(),
                                title: t.title,
                                dueDate: nextDateStr,
                                listId: t.listId,
                                repeat: t.repeat,
                                tagIds: [...(t.tagIds || [])],
                                completed: false
                            });
                        }
                        this.saveData();
                    }
                },

                deleteTask(taskId) {
                    const idx = this.tasks.findIndex(item => item.id === taskId);
                    if (idx > -1) {
                        const [removed] = this.tasks.splice(idx, 1);
                        removed.deletedAt = new Date().toLocaleString();
                        removed.deletedTimestamp = new Date().getTime();
                        this.trashTasks.push(removed);
                        this.saveData();
                    }
                },

                restoreTask(taskId) {
                    const idx = this.trashTasks.findIndex(item => item.id === taskId);
                    if (idx > -1) {
                        const [restored] = this.trashTasks.splice(idx, 1);
                        delete restored.deletedAt;
                        delete restored.deletedTimestamp;
                        this.tasks.push(restored);
                        this.saveData();
                    }
                },

                permanentDeleteTask(taskId) {
                    this.trashTasks = this.trashTasks.filter(item => item.id !== taskId);
                    this.saveData();
                },

                emptyTrash() {
                    this.trashTasks = [];
                    this.saveData();
                },

                openFolderModal() {
                    this.newFolderName = '';
                    this.folderModalOpen = true;
                },
                saveFolder() {
                    if (!this.newFolderName.trim()) return;
                    const newId = 'f_' + Date.now();
                    this.folders.push({ id: newId, name: this.newFolderName.trim() });
                    this.expandedFolders[newId] = true;
                    this.folderModalOpen = false;
                    this.saveData();
                },
                moveFolder(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex >= 0 && newIndex < this.folders.length) {
                        const item = this.folders.splice(index, 1)[0];
                        this.folders.splice(newIndex, 0, item);
                        this.saveData();
                    }
                },
                confirmDeleteFolder(folderId) {
                    this.confirmMessage = '删除文件夹将同时移除其下的所有子清单，确定吗？';
                    this.confirmCallback = () => {
                        this.folders = this.folders.filter(f => f.id !== folderId);
                        const subLists = this.lists.filter(l => l.folderId === folderId);
                        const subListIds = subLists.map(l => l.id);
                        this.lists = this.lists.filter(l => l.folderId !== folderId);
                        this.tasks = this.tasks.filter(t => !subListIds.includes(t.listId));
                        this.saveData();
                    };
                    this.confirmModalOpen = true;
                },

                openSubListModal(folderId) {
                    this.targetFolderIdForSub = folderId;
                    this.newList = { name: '', color: '#6366f1' };
                    this.listModalOpen = true;
                },
                saveList() {
                    if (!this.newList.name.trim()) return;
                    this.lists.push({
                        id: 'l_' + Date.now(),
                        folderId: this.targetFolderIdForSub,
                        name: this.newList.name.trim(),
                        color: this.newList.color
                    });
                    this.expandedFolders[this.targetFolderIdForSub] = true;
                    this.listModalOpen = false;
                    this.saveData();
                },
                moveList(listId, direction) {
                    const l = this.lists.find(item => item.id === listId);
                    if (!l) return;
                    const folderLists = this.lists.filter(item => item.folderId === l.folderId);
                    const idx = folderLists.findIndex(item => item.id === listId);
                    const newIdx = idx + direction;
                    if (newIdx >= 0 && newIdx < folderLists.length) {
                        const otherLists = this.lists.filter(item => item.folderId !== l.folderId);
                        folderLists.splice(idx, 1);
                        folderLists.splice(newIdx, 0, l);
                        this.lists = [...otherLists, ...folderLists];
                        this.saveData();
                    }
                },
                confirmDeleteList(listId) {
                    this.confirmMessage = '确定要删除该清单吗？';
                    this.confirmCallback = () => {
                        this.lists = this.lists.filter(l => l.id !== listId);
                        this.tasks.forEach(t => { if (t.listId === listId) t.listId = ''; });
                        this.saveData();
                    };
                    this.confirmModalOpen = true;
                },

                openTagModal() {
                    this.editingTag = { id: null, name: '' };
                    this.tagModalOpen = true;
                },
                openEditTagModal(tag) {
                    this.editingTag = { id: tag.id, name: tag.name };
                    this.tagModalOpen = true;
                },
                saveTag() {
                    if (!this.editingTag.name.trim()) return;
                    if (this.editingTag.id) {
                        const t = this.tags.find(item => item.id === this.editingTag.id);
                        if (t) t.name = this.editingTag.name.trim();
                    } else {
                        this.tags.push({ id: 'tag_' + Date.now(), name: this.editingTag.name.trim() });
                    }
                    this.tagModalOpen = false;
                    this.saveData();
                },
                confirmDeleteTag(tagId) {
                    this.confirmMessage = '确定要删除该标签吗？';
                    this.confirmCallback = () => {
                        this.tags = this.tags.filter(t => t.id !== tagId);
                        this.tasks.forEach(t => {
                            if (t.tagIds) t.tagIds = t.tagIds.filter(id => id !== tagId);
                        });
                        this.saveData();
                    };
                    this.confirmModalOpen = true;
                },

                executeConfirm() {
                    if (this.confirmCallback) this.confirmCallback();
                    this.confirmModalOpen = false;
                },

                get calendarHeaderTitle() {
                    const y = this.currentMonthYear.getFullYear();
                    const m = this.currentMonthYear.getMonth() + 1;
                    return `${y} 年 ${m} 月`;
                },
                changeMonth(delta) {
                    this.currentMonthYear = new Date(this.currentMonthYear.getFullYear(), this.currentMonthYear.getMonth() + delta, 1);
                },
                get calendarDays() {
                    const year = this.currentMonthYear.getFullYear();
                    const month = this.currentMonthYear.getMonth();
                    const firstDayOfMonth = new Date(year, month, 1);
                    const lastDayOfMonth = new Date(year, month + 1, 0);
                    
                    const days = [];
                    const firstDayOfWeek = firstDayOfMonth.getDay();
                    
                    for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                        const d = new Date(year, month, 1 - i);
                        days.push(this.formatDayObj(d, false));
                    }
                    for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                        const d = new Date(year, month, i);
                        days.push(this.formatDayObj(d, true));
                    }
                    const remaining = 42 - days.length;
                    for (let i = 1; i <= remaining; i++) {
                        const d = new Date(year, month + 1, i);
                        days.push(this.formatDayObj(d, false));
                    }
                    return days;
                },
                formatDayObj(d, isCurrentMonth) {
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const dateString = `${year}-${month}-${day}`;
                    const dayTasks = this.tasks.filter(t => t.dueDate === dateString);
                    return {
                        dateString,
                        dayNumber: d.getDate(),
                        isCurrentMonth,
                        isToday: dateString === this.todayString,
                        tasks: dayTasks
                    };
                },

                openHabitModal() {
                    this.newHabit = { emoji: '', name: '' };
                    this.habitModalOpen = true;
                },
                saveHabit() {
                    if (!this.newHabit.name.trim()) return;
                    this.habits.push({
                        id: 'h_' + Date.now(),
                        emoji: this.newHabit.emoji.trim() || '⭐',
                        name: this.newHabit.name.trim()
                    });
                    this.habitModalOpen = false;
                    this.saveData();
                },
                toggleHabitToday(habitId) {
                    const dateStr = this.todayString;
                    if (!this.habitLogs[dateStr]) {
                        this.habitLogs[dateStr] = [];
                    }
                    const idx = this.habitLogs[dateStr].indexOf(habitId);
                    if (idx > -1) {
                        this.habitLogs[dateStr].splice(idx, 1);
                    } else {
                        this.habitLogs[dateStr].push(habitId);
                    }
                    this.saveData();
                },
                isHabitCheckedToday(habitId) {
                    const dateStr = this.todayString;
                    return this.habitLogs[dateStr] && this.habitLogs[dateStr].includes(habitId);
                },
                getHabitCount(habitId) {
                    let count = 0;
                    const currentPrefix = this.todayString.slice(0, 7);
                    Object.keys(this.habitLogs).forEach(dateStr => {
                        if (dateStr.startsWith(currentPrefix) && this.habitLogs[dateStr].includes(habitId)) {
                            count++;
                        }
                    });
                    return count;
                },
                get todayCompletionRate() {
                    const list = this.tasks.filter(t => t.dueDate === this.todayString);
                    if (list.length === 0) return 0;
                    const completed = list.filter(t => t.completed).length;
                    return Math.round((completed / list.length) * 100);
                },
                get weekCompletionRate() { return this.todayCompletionRate; },
                get monthCompletionRate() { return this.todayCompletionRate; },
                getListCompletionRate(listId) {
                    const list = this.tasks.filter(t => t.listId === listId);
                    if (list.length === 0) return 0;
                    const completed = list.filter(t => t.completed).length;
                    return Math.round((completed / list.length) * 100);
                },
                getTagCompletionRate(tagId) {
                    const list = this.tasks.filter(t => t.tagIds && t.tagIds.includes(tagId));
                    if (list.length === 0) return 0;
                    const completed = list.filter(t => t.completed).length;
                    return Math.round((completed / list.length) * 100);
                },

                exportData() {
                    const data = {
                        tasks: this.tasks,
                        trashTasks: this.trashTasks,
                        folders: this.folders,
                        lists: this.lists,
                        tags: this.tags,
                        habits: this.habits,
                        habitLogs: this.habitLogs,
                        expandedFolders: this.expandedFolders
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `universe_center_backup_${this.todayString}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                },
                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.tasks) this.tasks = data.tasks;
                            if (data.trashTasks) this.trashTasks = data.trashTasks;
                            if (data.folders) this.folders = data.folders;
                            if (data.lists) this.lists = data.lists;
                            if (data.tags) this.tags = data.tags;
                            if (data.habits) this.habits = data.habits;
                            if (data.habitLogs) this.habitLogs = data.habitLogs;
                            if (data.expandedFolders) this.expandedFolders = data.expandedFolders;
                            this.saveData();
                            alert('备份数据导入成功！');
                        } catch(err) {
                            alert('导入失败，JSON 文件格式错误！');
                        }
                    };
                    reader.readAsText(file);
                }
            }
        }
    </script>
